function save(){localStorage.setItem('ts_money',money);localStorage.setItem('ts_owned',JSON.stringify(owned));localStorage.setItem('ts_selected',selected)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function showGarage(){renderGarage();show('garage')}
function renderGarage(){document.getElementById('money').textContent=money;document.getElementById('cars').innerHTML=cars.map(c=>{let own=owned.includes(c.key),sel=selected===c.key;return '<div class="card '+(sel?'selected':'')+'"><img class="carimg" src="'+c.img+'"><h2>'+c.name+'</h2><div>Hız: '+c.speed+'/10</div>'+(own?'<b>SAHİP</b>':'<div class="price">'+c.price+' ₺</div>')+'<br><button onclick="choose(\''+c.key+'\')">'+(sel?'SEÇİLİ':own?'SEÇ':'SATIN AL')+'</button></div>'}).join('')}
function choose(k){let c=cars.find(a=>a.key===k);if(!owned.includes(k)){if(money<c.price){alert('Yeterli paran yok.');return}money-=c.price;owned.push(k)}selected=k;save();renderGarage()}
function resetRoad(){obstacles=[];for(let i=0;i<6;i++)obstacles.push({x:105+Math.random()*270,y:-i*150-80,w:52,h:90})}
function startRace(){score=0;level=1;speed=4;running=true;x=240;document.getElementById('over').style.display='none';show('game');updateHud();resetRoad();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function restart(){startRace()}function updateHud(){lvl.textContent=level;scoreEl.textContent=score;gmoney.textContent=money}const lvl=document.getElementById('lvl'),scoreEl=document.getElementById('score'),gmoney=document.getElementById('gmoney');
function loop(t){if(!running)return;let dt=Math.min(32,t-last);last=t;ctx.clearRect(0,0,480,760);ctx.fillStyle='#252932';ctx.fillRect(70,0,340,760);ctx.fillStyle='#555';ctx.fillRect(75,0,5,760);ctx.fillRect(400,0,5,760);ctx.strokeStyle='#eee';ctx.lineWidth=5;ctx.setLineDash([35,35]);ctx.lineDashOffset=-(t/7)%70;ctx.beginPath();ctx.moveTo(240,0);ctx.lineTo(240,760);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#19351f';ctx.fillRect(0,0,70,760);ctx.fillRect(405,0,75,760);
obstacles.forEach(o=>{o.y+=(speed+level*.7)*(dt/16);ctx.fillStyle='#e64a35';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.fillStyle='#222';ctx.fillRect(o.x+7,o.y+12,38,18);ctx.fillRect(o.x+7,o.y+60,38,18);if(o.y>780){o.y=-120;o.x=105+Math.random()*270;score++;if(score%5===0){level++;speed+=.7}money+=5;save();updateHud()}});let im=carImages[selected],cw=100,ch=145;if(im&&im.complete&&im.naturalWidth)ctx.drawImage(im,x-cw/2,600,cw,ch);else{ctx.fillStyle='#fff';ctx.fillRect(x-cw/2,600,cw,ch)}for(let o of obstacles)if(x+38>o.x&&x-38<o.x+o.w&&635>o.y&&600<o.y+o.h){gameOver();return}raf=requestAnimationFrame(loop)}
function gameOver(){running=false;finalScore.textContent=score;over.style.display='flex';cancelAnimationFrame(raf)}function move(d){x+=d*22;x=Math.max(115,Math.min(365,x))}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});left.onpointerdown=()=>move(-1);right.onpointerdown=()=>move(1);renderGarage();
